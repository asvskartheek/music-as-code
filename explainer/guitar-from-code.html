<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guitar From Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400;6..144,500;6..144,700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm research-lab explainer
   IDEA: a field guide, one mechanism per page
   PICTURE: crisp geometric diagrams and real numbers from both releases
   COLOUR and TYPE: white canvas, blue/red/green/yellow primaries; Google Sans Flex
   LAYOUT: picture left, text right; one column under 820px */
:root{--paper:#ffffff;--card:#ffffff;--ink:#1f1f1f;--muted:#5f6368;--line:#e3e5e8;--soft:#f6f8fb;--blue:#1a73e8;--red:#d93025;--green:#188038;--yel:#f9ab00;--note:#fef7e0}
@media (prefers-color-scheme:dark){:root:not([data-theme='light']){--paper:#111316;--card:#181b1f;--ink:#e8eaed;--muted:#9aa0a6;--line:#2c3036;--soft:#1c2025;--blue:#8ab4f8;--red:#f28b82;--green:#81c995;--yel:#fdd663;--note:#2d2a1c}}
:root[data-theme='dark']{--paper:#111316;--card:#181b1f;--ink:#e8eaed;--muted:#9aa0a6;--line:#2c3036;--soft:#1c2025;--blue:#8ab4f8;--red:#f28b82;--green:#81c995;--yel:#fdd663;--note:#2d2a1c}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 'Google Sans Flex','Inter',system-ui,sans-serif;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;height:100dvh;overflow:hidden}
svg text{font-family:'Google Sans Flex','Inter',system-ui,sans-serif;fill:var(--ink)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line)}
.logo{display:flex;gap:4px}.logo i{width:9px;height:9px;border-radius:50%}
.bar .t{min-width:0;flex:1 1 0;font-weight:500;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font-size:14px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.btn{font:500 15px 'Google Sans Flex','Inter',sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 18px;min-height:44px;min-width:44px;cursor:pointer}
.btn.icon{display:inline-grid;place-items:center;padding:0;width:44px}.btn.icon svg{width:20px;height:20px}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:focus-visible,.thumb:focus-visible,.dot:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn[disabled]{opacity:.35;cursor:default}
.stage{overflow:auto;overscroll-behavior:contain}
.page{max-width:1240px;margin:0 auto;padding:32px 28px 40px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:56px;align-items:center;min-height:100%}
.page[hidden]{display:none}
.fig{background:var(--soft);border-radius:28px;padding:18px}
.fig svg{display:block;width:100%;height:auto}
.kick{font-size:14px;font-weight:500;color:var(--blue);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.kick::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}
h1,h2{font-weight:500;line-height:1.1;margin:0 0 16px;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(36px,5vw,56px)}h2{font-size:clamp(26px,3vw,36px)}
.idea{font-size:19px;margin:0 0 18px;color:var(--ink)}
mark{background:transparent;color:inherit;font-weight:700;box-shadow:inset 0 -.38em 0 color-mix(in srgb,var(--yel) 38%,transparent)}
.pts{list-style:none;padding:0;margin:0 0 20px}
.pts li{position:relative;padding-left:22px;margin:7px 0;color:var(--ink)}
.pts li::before{content:'';position:absolute;left:2px;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.pts li:nth-child(2)::before{background:var(--red)}.pts li:nth-child(3)::before{background:var(--green)}.pts li:nth-child(4)::before{background:var(--yel)}
.pts b{font-weight:700}
.hook{display:inline-flex;gap:10px;align-items:center;background:var(--note);border-radius:16px;padding:10px 16px;font-weight:500;margin:0 0 16px;max-width:100%}
.hook::before{content:'';flex:none;width:10px;height:10px;border-radius:50%;background:var(--yel)}
.ask{border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:0}
.ask b{color:var(--red);font-weight:500}
.src{font-size:13px;color:var(--muted);margin:12px 0 0}
.credit{color:var(--muted);margin:0 0 22px;max-width:52ch}
.cmp{width:100%;border-collapse:collapse;font-size:15px;margin:0 0 16px}
.cmp th,.cmp td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp thead th{font-weight:500;color:var(--muted);font-size:13px}
.cmp th[scope=row]{font-weight:500;color:var(--muted);width:30%}
.traps{display:grid;gap:10px;margin:0 0 16px;padding:0;list-style:none}
.traps li{border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.traps b{color:var(--red);font-weight:500}.traps .way{color:var(--green)}
.recap{grid-template-columns:minmax(0,1fr);align-items:start}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.thumb{font:14px/1.35 'Google Sans Flex','Inter',sans-serif;color:var(--ink);text-align:left;background:var(--soft);border:0;border-radius:18px;padding:10px;cursor:pointer}
.thumb:hover{outline:1px solid var(--line)}
.thumb svg{width:100%;height:auto;display:block;background:var(--card);border-radius:12px}
.thumb span{display:block;margin-top:6px}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:8px 20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.foot .cr{flex:1 1 360px}.foot a{color:var(--blue)}
.dots{display:flex;flex-wrap:wrap}
.dot{width:20px;height:24px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.dot i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dot[aria-current] i{background:var(--blue);width:9px;height:9px}
@media(max-width:820px){.page{grid-template-columns:minmax(0,1fr);gap:24px;padding:20px 16px 30px;align-items:start}.dots{display:none}.foot{font-size:12px;padding:6px 16px}.idea{font-size:18px}}
@media(max-width:600px){.cmp{font-size:13px}.cmp th,.cmp td{padding:6px 4px}}
@media(max-width:480px){.count,.logo{display:none}.bar{padding:8px 12px}}
@media(prefers-reduced-motion:no-preference){.page:not([hidden]) .fig{animation:in .35s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
code{font:0.9em ui-monospace,Menlo,monospace;background:var(--soft);padding:1px 5px;border-radius:6px}
</style>
</head>
<body>
<header class="bar">
  <span class="logo" aria-hidden="true"><i style="background:var(--blue)"></i><i style="background:var(--red)"></i><i style="background:var(--yel)"></i><i style="background:var(--green)"></i></span>
  <div class="t">Guitar from code</div>
  <span class="count" id="count"></span>
  <button class="btn icon" id="theme" aria-label="Switch to dark mode"></button>
  <button class="btn" id="prev" aria-label="Previous page">&larr;</button>
  <button class="btn" id="next" aria-label="Next page">&rarr;</button>
</header>
<main class="stage" id="stage"></main>
<footer class="foot">
  <span class="cr">A visual guide to <code>acoustic_guitar.py</code> and <code>bossa_nova.py</code> in this repo. String model: Karplus–Strong (1983). Numbers on each page were measured from the code.</span>
  <nav class="dots" id="dots" aria-label="Pages"></nav>
</footer>

 idea:'A speaker cone moves back and forth. A .wav file stores <mark>its position 44,100 times a second</mark>, each a number between −1 and +1.',
 pts:['<b>Pitch</b> is how often the pattern repeats: every 9.1 ms here, so 110 Hz.','<b>Loudness</b> is how far the numbers swing.','<b>Tone</b> is the shape of the wiggle inside each repeat.'],
 hook:'Make the right numbers and you have the sound.',ask:'What would a pattern that repeats twice as often sound like?',sk:'samples'},
{id:'frets',kick:'3 · Sound as numbers',title:'Each fret raises the pitch by one twelfth of an octave',
 idea:'The six open strings have fixed pitches. Every fret <mark>multiplies the pitch by 2^(1/12)</mark>, so fret 12 doubles it.',
 pts:['<b>Open strings</b>: 82, 110, 147, 196, 247 and 330 Hz, low E to high e.','<b>Fret 7</b> on the A string: 110 × 1.498 = 165 Hz.','<b>The code</b>: <code>OPEN_STRINGS[string] * 2 ** (fret / 12)</code>.'],
 hook:'Twelve frets, one octave.',ask:'Why does a fretboard’s fret spacing shrink as you go up the neck?',sk:'frets'},
{id:'the-loop',kick:'4 · One string',title:'A string is a loop of numbers that goes round and round',
 idea:'This is the <mark>Karplus–Strong</mark> trick: keep one pitch-period of numbers in a ring, play them in order, and slightly soften each one before putting it back.',
 pts:['<b>Ring length</b> sets the pitch: 400 cells for the A string.','<b>Smoothing</b> each pass makes the sound mellow and fade, like a real string.','<b>Cheap</b>: a few multiplies per sample, no physics simulation.'],
 hook:'The ring length is the pitch.',ask:'What would you hear if nothing were softened on the way round?',sk:'loop'},
{id:'pluck',kick:'5 · One string',title:'The pluck is shaped noise',
 idea:'The ring starts full of random numbers. They are <mark>smoothed to sound like a fingertip</mark> on nylon, then shaped by where the string is plucked.',
 pts:['<b>Noise</b> holds every frequency, so the loop has something to work with.','<b>Velocity</b>: harder plucks get less smoothing, so they sound brighter.','<b>Pluck point</b>: subtracting a copy shifted by 1/5 of the ring mimics plucking 1/5 along the string.'],
 hook:'Start with noise, end with a note.',ask:'Why does a pick sound brighter than a thumb?',sk:'pluck'},
{id:'pluck-point',kick:'6 · One string',title:'Where you pluck decides which overtones go missing',
 idea:'Plucking 1/5 along the string <mark>silences the 5th and 10th harmonics</mark>. This was measured from one dry note out of the code.',
 pts:['<b>Real guitars</b> do this too: modes with a still point right where you pluck never get started.','<b>Measured</b>: harmonics 5 and 10 sit about 30 dB below their neighbours.','<b>Try it</b>: plucking near the bridge keeps more high harmonics, so it sounds brighter.'],
 hook:'The pluck point leaves a fingerprint.',ask:'Which harmonics would vanish if you plucked exactly in the middle?',sk:'fifth'},
{id:'highs-fade',kick:'7 · One string',title:'High overtones die first',
 idea:'Each trip averages two neighbouring numbers. That is a gentle filter that <mark>takes more off the highs than the lows</mark> every time round.',
 pts:['<b>Fundamental</b>: down 37 dB from 0.05 s to 2.5 s.','<b>10th harmonic</b>: down 44 dB over the same time.','<b>Result</b>: a bright attack that mellows as it rings, like nylon.'],
 hook:'Bright at first, warm later.',ask:'What kind of instrument would you get if the lows faded first?',sk:'damp'},
{id:'ring-time',kick:'8 · One string',title:'Each trip loses a fixed fraction',
 idea:'Every pass multiplies the ring by a number just under 1. For the A string that is <mark>0.984, chosen so it reaches −60 dB in 4.0 s</mark>.',
 pts:['<b>Trips per second</b> equal the pitch: 110 for the A string.','<b>Formula</b>: <code>0.001 ** (1 / (freq * ring_time))</code>.','<b>The curve</b> below is the measured envelope of one note.'],
 hook:'A tiny loss, repeated 441 times.',ask:'Why do high notes need a smaller loss per trip to ring as long?',sk:'loss'},
{id:'bass-rings-longer',kick:'9 · One string',title:'Bass strings ring longer than treble',
 idea:'Ring time shrinks gently with pitch: <mark>4.5 s for low E, 2.6 s for high e</mark>.',
 pts:['<b>Real strings</b>: thicker, slower strings lose energy more slowly.','<b>Gentle slope</b>: the 0.4 power keeps high notes from dying too fast.','<b>Fretted notes</b> use the same rule, so higher frets ring shorter.'],
 hook:'Low and long, high and short.',ask:'How would a piano’s decay times compare?',sk:'decay'},
{id:'exact-tuning',kick:'10 · One string',title:'An all-pass filter covers the leftover fraction of a sample',
 idea:'A ring can only hold whole cells, but a note needs <mark>400.91 samples per trip</mark>. The smoothing adds 0.5; an all-pass filter adds the last 0.41.',
 pts:['<b>All-pass</b>: delays the signal slightly without changing its loudness.','<b>Without it</b>, high e at fret 12 would be 10 cents sharp.','<b>Chords</b> need this: small errors beat against each other.'],
 hook:'Whole cells, plus a sliver.',ask:'Why does rounding hurt high notes more than low ones?',sk:'tuning'},
{id:'stopping',kick:'11 · One string',title:'A note stops when the same string is played or muted',
 idea:'One string plays one note at a time. A new event <mark>fades the old note out</mark>: quickly for a fresh pluck, more softly for a resting finger.',
 pts:['<b>New pluck</b>: 8 ms fade, so the old note doesn’t click.','<b>Finger mute</b>: 35 ms fade, like flesh damping a string.','<b>Bossa</b> mutes the finger notes after 1.2–2.6 eighths for that short, clipped feel.'],
 hook:'Stopping a note is part of playing it.',ask:'Why would cutting a note to zero instantly make a click?',sk:'mute'},
{id:'body',kick:'12 · The wooden box',title:'Three resonances stand in for the wooden body',
 idea:'Strings alone sound thin. Three <mark>band-pass filters at 105, 210 and 400 Hz</mark> add the boom and warmth of the box.',
 pts:['<b>105 Hz</b>: air inside the body, the main “boom”.','<b>210 Hz</b>: the soundboard flexing.','<b>Mixed in</b> on top of the dry strings at 0.9, 0.7 and 0.4.'],
 hook:'The box is three bumps.',ask:'Which strings get the most help from these bumps, and why?',sk:'body'},
{id:'room',kick:'13 · The wooden box',title:'A small room is six short delays',
 idea:'Four echoing delays of <mark>30–44 ms</mark> build up a cloud of reflections, and two short all-passes blur them together.',
 pts:['<b>Different lengths</b> stop the echoes lining up into a buzz.','<b>Feedback 0.72–0.78</b>: each echo is a little quieter than the last.','<b>Subtle</b>: only about 3% of the reverb is mixed into the dry sound.'],
 hook:'A room is echoes too close to hear apart.',ask:'What would one long delay sound like instead of four short ones?',sk:'room'},
{id:'groove',kick:'14 · Playing it',title:'The bossa feel: steady thumb, pushing fingers',
 idea:'On an eighth-note grid, the <mark>thumb plays beats 1 and 3</mark> while the fingers play a two-bar pattern that lands between them.',
 pts:['<b>Thumb</b>: same two hits every bar.','<b>Bar A</b> fingers: 1, the “and” of 2, and 4.','<b>Bar B</b> fingers: 2 and the “and” of 3.'],
 hook:'The thumb keeps time, the fingers dance.',ask:'Clap the finger part while tapping the thumb part. Where does it feel off-balance?',sk:'groove'},
{id:'chords',kick:'15 · Playing it',title:'Chords are lists of (string, fret)',
 idea:'Each chord shape is <mark>two thumb notes and three or four finger notes</mark>, written exactly as a guitarist would finger them.',
 pts:['<b>Thumb</b>: root, then the fifth on the next bar beat.','<b>Fingers</b>: the colourful upper notes (9ths, 13ths).','<b>Form</b>: an 11-bar progression, then a slow roll up C6/9.'],
 hook:'A chord is just a few coordinates.',ask:'What would you change to play this progression in a different key?',sk:'chord'},
{id:'human-touch',kick:'16 · Playing it',title:'Small random wobbles make it sound played',
 idea:'Every note gets <mark>tiny timing and touch variations</mark>. A seeded random generator keeps them the same on every run.',
 pts:['<b>Timing</b>: each beat lands up to 6 ms early or late.','<b>Strum</b>: finger notes land 4 ms apart, not together.','<b>Accents</b>: off-beat finger notes are a bit harder than on-beat ones.'],
 hook:'Perfect timing sounds like a machine.',ask:'How much wobble is too much before it sounds sloppy?',sk:'human'},
{id:'result',kick:'17 · Playing it',title:'The result: 24 seconds from 257 lines',
 idea:'The loudness of the real file shows the <mark>two-bar pulse</mark> repeating under the chord changes, then the last chord ringing out.',
 pts:['<b>Deterministic</b>: re-running produced a byte-identical .wav.','<b>Fast</b>: about 1.5 s to render 24.2 s on this Mac.','<b>Normalised</b>: the loudest moment sits at −1 dB.'],
 hook:'Every sample came from arithmetic.',ask:'Which part would you tweak first to make it sound more real?',sk:'song'},
{id:'map',type:'compare',kick:'18 · Honest limits',title:'Real guitar vs the code',heads:['Real guitar','In the code'],
 rows:[['String','vibrating nylon','ring of numbers'],['Pitch','string length and tension','ring length'],['Pluck','fingertip shape','smoothed noise − shifted copy'],['Losses','air, wood, string friction','× loss + averaging per trip'],['Body','wood and air resonating','3 band-pass filters'],['Room','walls reflecting','4 delays + 2 all-passes'],['Player','hands','event list + small randomness']],
 hook:'Every physical part has a small stand-in.',ask:'Which stand-in is the roughest approximation?',sk:'anatomy'},
{id:'limits',type:'traps',kick:'19 · Honest limits',title:'What this guitar can’t do yet',
 items:[['Strings are isolated','Real strings shake each other through the bridge.','Feed a little of each string into the others.'],
  ['Mono','One channel, no sense of space.','Pan strings slightly, or use a stereo reverb.'],
  ['No finger noises','No squeaks, slides or fret buzz.','Add short noise bursts at shifts.'],
  ['Fixed body','The body filters are the same for every note.','Model it from a recorded impulse response.']],
 hook:'Good enough to groove, room to grow.',ask:'Which limit would you fix first?',sk:'limits'},
{id:'recap',type:'recap',title:'Recap: tap any diagram to go back'}
];

/* ---------- render ---------- */
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
var stage=document.getElementById('stage'),dots=document.getElementById('dots'),secs=[];
PAGES.forEach(function(p,i){
  var s=el('section','page');s.id=p.id;s.hidden=true;s.setAttribute('aria-label','Page '+(i+1));
  if(p.type==='cover'){
    var f=el('div','fig');var sv=sketch(SK.cover);sv.setAttribute('aria-label','A pluck feeds a string loop, then a body and a room, producing the bossa nova waveform');f.appendChild(sv);s.appendChild(f);
    var t=el('div','txt');t.appendChild(el('p','kick','A field guide to this repo'));t.appendChild(el('h1',null,'How code became an acoustic guitar'));
    t.appendChild(el('p','credit','From a burst of noise to a bossa nova jam, page by page through <code>acoustic_guitar.py</code> and <code>bossa_nova.py</code>.'));
    var b=el('button','btn pri','Start');b.addEventListener('click',function(){go(1)});t.appendChild(b);s.appendChild(t);
  }else if(p.type==='recap'){
    s.classList.add('recap');var t=el('div','txt');t.appendChild(el('h2',null,p.title));
    var g=el('div','thumbs');
    PAGES.forEach(function(q,j){if(!q.sk||q.type==='cover')return;var b=el('button','thumb');var sv=sketch(SK[q.sk]);sv.setAttribute('aria-hidden','true');b.appendChild(sv);b.appendChild(el('span',null,'<b>'+q.kick.split(' · ')[0]+'.</b> '+q.hook));b.addEventListener('click',function(){go(j)});g.appendChild(b)});
    t.appendChild(g);s.appendChild(t);
  }else{
    var f=el('div','fig');var sv=sketch(SK[p.sk]);sv.setAttribute('aria-label','Diagram: '+p.title);f.appendChild(sv);s.appendChild(f);
    var t=el('div','txt');t.appendChild(el('p','kick',p.kick));t.appendChild(el('h2',null,p.title));
    if(p.idea)t.appendChild(el('p','idea',p.idea));
    if(p.pts){var u=el('ul','pts');p.pts.forEach(function(x){u.appendChild(el('li',null,x))});t.appendChild(u)}
    if(p.rows){var tb='<thead><tr><th></th><th>'+p.heads[0]+'</th><th>'+p.heads[1]+'</th></tr></thead><tbody>'+p.rows.map(function(r){return '<tr><th scope="row">'+r[0]+'</th><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>'}).join('')+'</tbody>';t.appendChild(el('table','cmp',tb))}
    if(p.items){var u=el('ul','traps');p.items.forEach(function(x){u.appendChild(el('li',null,'<b>'+x[0]+'</b> · '+x[1]+'<br><span class="way">→ '+x[2]+'</span>'))});t.appendChild(u)}
    t.appendChild(el('div','hook',p.hook));
    t.appendChild(el('p','ask','<b>Ask the room:</b> '+p.ask));
    s.appendChild(t);
  }
  stage.appendChild(s);secs.push(s);
  var d=el('button','dot','<i></i>');d.setAttribute('aria-label','Go to page '+(i+1));d.addEventListener('click',function(){go(i)});dots.appendChild(d);
});
var cur=-1,prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count');
function go(i,fromHash){i=Math.max(0,Math.min(PAGES.length-1,i));if(i===cur)return;cur=i;
  secs.forEach(function(s,j){s.hidden=j!==i});
  [].forEach.call(dots.children,function(d,j){if(j===i)d.setAttribute('aria-current','page');else d.removeAttribute('aria-current')});
  prev.disabled=i===0;next.disabled=i===PAGES.length-1;count.textContent=(i+1)+' / '+PAGES.length;stage.scrollTop=0;
  if(!fromHash&&location.hash.slice(1)!==PAGES[i].id){try{history.replaceState(null,'','#'+PAGES[i].id)}catch(e){location.hash=PAGES[i].id}}}
function fromHash(){var h=location.hash.slice(1),k=PAGES.findIndex(function(p){return p.id===h});go(k<0?0:k,true)}
prev.addEventListener('click',function(){go(cur-1)});next.addEventListener('click',function(){go(cur+1)});
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1)});
var sx=null,sy=null;stage.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
stage.addEventListener('touchend',function(e){if(sx==null)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(cur+(dx<0?1:-1));sx=null},{passive:true});
window.addEventListener('hashchange',fromHash);
window.SKETCH_PAGES=PAGES.map(function(p){return p.id});
fromHash();

/* ---------- light / dark toggle ---------- */
(function(){
  var root=document.documentElement,tb=document.getElementById('theme'),mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
  var MOON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.6 6.6 0 0 0 10.7 10.7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
  var SUN='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  function dark(){var t=root.getAttribute('data-theme');return t?t==='dark':!!(mq&&mq.matches)}
  function paint(){var d=dark();tb.innerHTML=d?SUN:MOON;tb.setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode');tb.title=tb.getAttribute('aria-label')}
  try{var s=localStorage.getItem('theme');if(s==='dark'||s==='light')root.setAttribute('data-theme',s)}catch(e){}
  tb.addEventListener('click',function(){var t=dark()?'light':'dark';root.setAttribute('data-theme',t);try{localStorage.setItem('theme',t)}catch(e){}paint()});
  if(mq&&mq.addEventListener)mq.addEventListener('change',paint);
  new MutationObserver(paint).observe(root,{attributes:true,attributeFilter:['data-theme']});
  paint();
})();
}
</script>
